version: 1
project: TCC ETL Plataforma Lattes
source:
  root_element: CURRICULO-VITAE
  relative_path_convention: Every source.path and field XPath is relative to /CURRICULO-VITAE/ (no leading root
    prefix).
  expected_files: 57624
  id_lattes_xpath: '@NUMERO-IDENTIFICADOR'
  researcher_name_xpath: DADOS-GERAIS/@NOME-COMPLETO
  inventories:
    tags: atributos de elementos conferidos contra tags_xml.csv
    attributes: atributos conferidos contra atributos_xml.csv
  sample_validation:
    required_real_xml_samples: 2
    recommended_real_xml_samples: 3
    status: PENDING_INPUT_FILES
    note: No real XML samples were present in the available project files when this mapping was created.
global_rules:
  order_xml: 1-based counter per mapped repeated source element within one XML; never reuse SEQUENCIA-* attributes.
  authors: Concatenate individual AUTORES entries sorted by ORDEM-DE-AUTORIA numeric ascending, stable by source
    order for ties; separator is "; ".
  missing_id: id_lattes remains NULL; chave_pesquisador = "ARQUIVO:" + caminho_relativo when the source ID is absent.
  source_status: Keep PENDENTE until parsing and all mapped inserts complete; set PROCESSADO only on success, ERRO
    on parse/processing error.
  no_truncation: Reject/log values exceeding SQL column length; never truncate silently.
  count_semantics: expected_counts come from structural inventory for all 57,624 files; they are validation baselines,
    not promises that every individual XML has these counts.
mappings:
- table: stg.curriculo_origem
  record_grain: one_row_per_xml_file
  source:
    path: .
    expected_counts:
      occurrences_total: 57624
      files_with_occurrence: 57624
      total_files_analyzed: 57624
  fields:
    id_lattes_original:
      xpath: '@NUMERO-IDENTIFICADOR'
      nullable: true
      expected_counts: &id001
        occurrences_total: 56251
        files_with_occurrence: 56251
        total_files_analyzed: 57624
    chave_pesquisador:
      derived: id_lattes_original if present else "ARQUIVO:" + caminho_relativo
    status_processamento:
      derived: PROCESSADO only after all mapped sections succeed; otherwise ERRO
    hash_sha256:
      derived: SHA-256 of raw file bytes
    caminho_relativo:
      derived: path relative to configured input root
    nome_arquivo:
      derived: basename of input file
- table: stg.pesquisador
  record_grain: one_row_per_xml_file
  source:
    path: .
    expected_counts:
      occurrences_total: 57624
      files_with_occurrence: 57624
      total_files_analyzed: 57624
  fields:
    id_lattes:
      xpath: '@NUMERO-IDENTIFICADOR'
      nullable: true
      expected_counts: *id001
    chave_pesquisador:
      derived: same value as stg.curriculo_origem.chave_pesquisador
    nome:
      xpath: DADOS-GERAIS/@NOME-COMPLETO
      nullable: true
      expected_counts:
        occurrences_total: 57624
        files_with_occurrence: 57624
        total_files_analyzed: 57624
    atuacao_profissional:
      derived_from_table: stg.atuacao_profissional
      rule: institution with lowest valid sequencia_importancia; deterministic tie-break by ordem_xml
